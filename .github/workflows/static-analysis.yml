name: Static Analysis (reusable)

# Cap the GITHUB_TOKEN at workflow scope to the minimum every job needs.
# None of the jobs below write to the repo — they read code, run lints,
# build artifacts, and (for verifiable-build) upload an artifact via the
# Actions Cache API, which doesn't need any token scope. Declaring
# permissions here overrides whatever the caller granted, so a caller
# with a broader default token can't accidentally widen the blast radius
# of any compromised step or third-party action.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      run-rust:
        description: "Run clippy + cargo-deny: 'auto' | 'true' | 'false'"
        required: false
        default: "auto"
        type: string
      run-solana:
        description: "Run Sec3 X-Ray + solana-lints: 'auto' | 'true' | 'false'"
        required: false
        default: "auto"
        type: string
      rust-workspace:
        description: "Path to Rust workspace root (must contain Cargo.toml)"
        required: false
        default: "."
        type: string
      anchor-workspace:
        description: "Path to Anchor workspace root (must contain Anchor.toml). Falls back to rust-workspace when empty."
        required: false
        default: ""
        type: string
      anchor-programs-path:
        description: "Path Sec3 X-Ray scans, resolved relative to anchor-workspace (the sec3-xray job's working directory). When empty, defaults to `programs` (i.e. <anchor-workspace>/programs)."
        required: false
        default: ""
        type: string
      rust-toolchain:
        description: "Toolchain for clippy"
        required: false
        default: "stable"
        type: string
      solana-lints-toolchain:
        description: "Nightly toolchain for solana-lints (must match upstream crytic/solana-lints rust-toolchain)"
        required: false
        default: "nightly-2025-01-09"
        type: string
      clippy-deny-warnings:
        description: "Treat clippy warnings as errors"
        required: false
        default: true
        type: boolean
      xray-version:
        description: "Sec3 X-Ray release tag to install"
        required: false
        default: "v0.0.6"
        type: string
      xray-sha256:
        description: "SHA256 of the Sec3 X-Ray linux-amd64 tarball. Optional but strongly recommended: when set, the downloaded archive is verified against this checksum before extraction, protecting against tampered release artifacts. Leave empty to skip verification."
        required: false
        default: ""
        type: string
      anchor-cli-version:
        description: "anchor-cli version installed for the sec3-xray job. X-Ray shells out to `anchor` for IDL extraction; missing it produces incomplete analysis."
        required: false
        default: "0.31.1"
        type: string
      solana-lints-ref:
        description: "crytic/solana-lints git ref (commit SHA or tag) to build lints from"
        required: false
        default: "e0f31e2e69c62a33669bf657343eab2d94e6dc9d"
        type: string
      cargo-dylint-version:
        description: "cargo-dylint / dylint-link version to install. Pinned to 4.1.0 because dylint_internal 4.1.1+ bumped cargo_metadata from ^0.19 to ^0.22, which pulls cargo-platform 0.3.x (rustc >=1.88) — incompatible with the nightly-2025-01-09 (rustc 1.86) used to build the lints. dylint 4.1.0 uses cargo_metadata 0.19 → cargo-platform 0.1.x, which builds cleanly on 1.86."
        required: false
        default: "4.1.0"
        type: string
      deny-config:
        description: "URL of the cargo-deny config to use. Pin to a tag/SHA for stable behavior across reusable-workflow versions."
        required: false
        default: "https://raw.githubusercontent.com/marinade-finance/.github/main/deny.toml"
        type: string
      solana-verify-version:
        description: "solana-verify CLI version (Ellipsis Labs/solana-verifiable-build) to install for the verifiable-build job."
        required: false
        default: "0.4.15"
        type: string

# `persist-credentials: false` on every actions/checkout: none of the jobs
# below push back to the repo (they only read code, run lints, build
# artifacts, upload-artifact), so the default `GITHUB_TOKEN` injected into
# git config by checkout is dead weight. Dropping it limits the blast radius
# of any compromised step or third-party action — a downstream `cargo`
# build script can no longer use the token to read or push to the repo.

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      has-rust: ${{ steps.check.outputs.has-rust }}
      has-anchor: ${{ steps.check.outputs.has-anchor }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - id: check
        shell: bash
        env:
          RUN_RUST: ${{ inputs.run-rust }}
          RUN_SOLANA: ${{ inputs.run-solana }}
          RUST_WORKSPACE: ${{ inputs.rust-workspace }}
          ANCHOR_WORKSPACE_INPUT: ${{ inputs.anchor-workspace }}
          ANCHOR_WORKSPACE: ${{ inputs.anchor-workspace || inputs.rust-workspace }}
        run: |
          set -euo pipefail

          if [[ ! -d "$RUST_WORKSPACE" ]]; then
            echo "::error::rust-workspace '$RUST_WORKSPACE' does not exist"
            exit 1
          fi

          # When run-solana is 'false', skip Anchor workspace validation
          # entirely — a consumer should be able to disable Solana checks
          # even if anchor-workspace is set (or accidentally set).
          # Otherwise, when run-solana is 'true' or the caller set
          # anchor-workspace explicitly, treat it as an assertion that an
          # Anchor workspace exists there and fail fast if not.
          if [[ "$RUN_SOLANA" != "false" ]] && \
             [[ -n "$ANCHOR_WORKSPACE_INPUT" || "$RUN_SOLANA" == "true" ]]; then
            if [[ ! -d "$ANCHOR_WORKSPACE" ]]; then
              echo "::error::anchor-workspace '$ANCHOR_WORKSPACE' does not exist"
              exit 1
            fi
            if [[ ! -f "$ANCHOR_WORKSPACE/Anchor.toml" ]]; then
              echo "::error::Anchor.toml not found at '$ANCHOR_WORKSPACE/Anchor.toml'"
              exit 1
            fi
          fi

          # Rust detection — require Cargo.toml at the workspace root, since
          # `cargo clippy` and `cargo-deny` both need a root manifest. A nested
          # crate without a root manifest would otherwise enable jobs that fail.
          # When run-rust is forced 'true', assert the root manifest exists so
          # callers get a clear configuration error instead of a cryptic
          # Cargo error in the downstream clippy/cargo-deny jobs.
          if [[ "$RUN_RUST" == "true" ]]; then
            if [[ ! -f "$RUST_WORKSPACE/Cargo.toml" ]]; then
              echo "::error::run-rust='true' but Cargo.toml not found at '$RUST_WORKSPACE/Cargo.toml'"
              exit 1
            fi
            HAS_RUST=true
          elif [[ "$RUN_RUST" == "false" ]]; then
            HAS_RUST=false
          elif [[ -f "$RUST_WORKSPACE/Cargo.toml" ]]; then
            HAS_RUST=true
          else
            HAS_RUST=false
          fi

          # Anchor detection — Anchor.toml at the root of anchor-workspace.
          # No fallback to anchor-lang dependency: off-chain services that
          # consume anchor-client are not Anchor programs.
          if [[ "$RUN_SOLANA" == "true" ]]; then
            HAS_ANCHOR=true
          elif [[ "$RUN_SOLANA" == "false" ]]; then
            HAS_ANCHOR=false
          elif [[ -d "$ANCHOR_WORKSPACE" && -f "$ANCHOR_WORKSPACE/Anchor.toml" ]]; then
            HAS_ANCHOR=true
          else
            HAS_ANCHOR=false
          fi

          echo "has-rust=$HAS_RUST" >> "$GITHUB_OUTPUT"
          echo "has-anchor=$HAS_ANCHOR" >> "$GITHUB_OUTPUT"

          {
            echo "## Detection results"
            echo "- Rust workspace: \`$RUST_WORKSPACE\` → has-rust=\`$HAS_RUST\`"
            echo "- Anchor workspace: \`$ANCHOR_WORKSPACE\` → has-anchor=\`$HAS_ANCHOR\`"
          } >> "$GITHUB_STEP_SUMMARY"

  clippy:
    needs: detect
    if: needs.detect.outputs.has-rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.rust-workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy

      # Consumer's rust-toolchain.toml overrides the toolchain installed above;
      # add clippy for whatever cargo will actually invoke in the workspace.
      - name: Ensure clippy is installed for the active toolchain
        working-directory: ${{ inputs.rust-workspace }}
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup component add clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ${{ inputs.rust-workspace }}

      - name: cargo clippy
        run: |
          if [[ "${{ inputs.clippy-deny-warnings }}" == "true" ]]; then
            cargo clippy --all-targets --all-features -- -D warnings
          else
            cargo clippy --all-targets --all-features
          fi

  cargo-deny:
    needs: detect
    if: needs.detect.outputs.has-rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Write deny.toml inside ${{ github.workspace }} (mounted at the same
      # path on host and inside the cargo-deny-action's docker container —
      # /home/runner/work/<repo>/<repo> ↔ /github/workspace, with the
      # action's working directory pinned to the workspace), then pass a
      # relative `--config` path so it resolves identically in both. Writing
      # to ${{ runner.temp }} doesn't work: that dir is mounted at
      # /github/runner_temp inside the container, so an absolute host path
      # like /home/runner/work/_temp/deny.toml doesn't exist there and
      # cargo-deny silently falls back to its default config.
      - name: Fetch cargo-deny config
        env:
          DENY_CONFIG_URL: ${{ inputs.deny-config }}
          DENY_CONFIG_PATH: ${{ inputs.rust-workspace }}/.ci-deny.toml
        run: curl -fsSL "$DENY_CONFIG_URL" -o "$DENY_CONFIG_PATH"

      - uses: EmbarkStudios/cargo-deny-action@5bb39ff5d5a0e94dc9e2dc94eced0c6129743a57 # v2
        with:
          command: check
          manifest-path: ${{ inputs.rust-workspace }}/Cargo.toml
          command-arguments: --config ${{ inputs.rust-workspace }}/.ci-deny.toml all

  sec3-xray:
    needs: detect
    if: needs.detect.outputs.has-anchor == 'true'
    runs-on: ubuntu-24.04
    # X-Ray (and the `anchor` CLI it shells out to for IDL extraction) needs
    # to run from the Anchor workspace so it can find Anchor.toml and the
    # programs/ directory. Setup steps below override this to the repo root
    # via `working-directory: ${{ github.workspace }}` where appropriate.
    defaults:
      run:
        working-directory: ${{ inputs.anchor-workspace || inputs.rust-workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache anchor-cli binary
        id: cache-anchor
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ runner.os }}-${{ inputs.anchor-cli-version }}

      - name: Install anchor-cli
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: cargo install --locked anchor-cli --version ${{ inputs.anchor-cli-version }}

      - name: Install Sec3 X-Ray
        working-directory: ${{ github.workspace }}
        env:
          XRAY_VERSION: ${{ inputs.xray-version }}
          XRAY_SHA256: ${{ inputs.xray-sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.xray"
          TARBALL="${RUNNER_TEMP:-/tmp}/xray.tar.gz"
          curl -fsSL \
            "https://github.com/sec3-product/x-ray/releases/download/${XRAY_VERSION}/x-ray-${XRAY_VERSION}-linux-amd64.tar.gz" \
            -o "$TARBALL"
          if [[ -n "$XRAY_SHA256" ]]; then
            echo "$XRAY_SHA256  $TARBALL" | sha256sum -c -
          else
            echo "::warning::xray-sha256 not set — skipping integrity check of X-Ray tarball. Pin a SHA256 via the xray-sha256 input to guard against tampered release artifacts."
            sha256sum "$TARBALL"
          fi
          tar -xz -C "$HOME/.xray" -f "$TARBALL"
          rm -f "$TARBALL"
          echo "$HOME/.xray/bin" >> "$GITHUB_PATH"

      - name: Verify tool installations
        working-directory: ${{ github.workspace }}
        # Avoid piping `xray --help` under `pipefail`: `head -20` exits early
        # and the SIGPIPE can fail the step. Use a brace group with a tail
        # `|| true` so the fallback is genuinely best-effort.
        run: |
          set -euo pipefail
          if ! xray --version 2>&1; then
            { xray --help 2>&1 | head -20; } || true
          fi
          anchor --version

      - name: Run X-Ray
        env:
          # anchor-programs-path is resolved against the job's
          # working-directory (anchor-workspace), so the default `programs`
          # works for the standard Anchor layout regardless of where the
          # workspace lives in the repo.
          ANCHOR_PROGRAMS_PATH: ${{ inputs.anchor-programs-path || 'programs' }}
        # X-Ray exits 0 even when sub-tools (anchor, the LLVM IR pass) emit
        # errors and the final "no issues detected" path is reached. Capture
        # output and fail on subprocess failures (`sh: <n>:`) and X-Ray's own
        # fatal output (`Error:` / `ERROR:`). Do NOT match generic `: error: `
        # MLIR/LLVM diagnostics — X-Ray's IR-lowering pass spuriously emits
        # those on perfectly valid Anchor code (e.g. `'llvm.call' op calling
        # function with void result must not produce values` on `&mut`
        # references), making the gate unusable in practice.
        run: |
          set -euo pipefail
          if [[ ! -d "$ANCHOR_PROGRAMS_PATH" ]]; then
            echo "::error::anchor-programs-path '$ANCHOR_PROGRAMS_PATH' does not exist"
            exit 1
          fi

          LOG="${RUNNER_TEMP:-/tmp}/xray.log"
          set -o pipefail
          xray "$ANCHOR_PROGRAMS_PATH" 2>&1 | tee "$LOG"

          if grep -nE '(^sh: [0-9]+:|^Error:|^ERROR:)' "$LOG" > /dev/null; then
            echo "::error::X-Ray reported errors during analysis (see annotations below)"
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -nE '(^sh: [0-9]+:|^Error:|^ERROR:)' "$LOG")
            exit 1
          fi

  solana-lints:
    needs: detect
    if: needs.detect.outputs.has-anchor == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.anchor-workspace || inputs.rust-workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Install stable first, then nightly. Order matters: dtolnay/rust-toolchain
      # makes the most-recently-installed toolchain the rustup default. We want
      # nightly as the default for the lint builds and the `cargo dylint` run,
      # but cargo-dylint/dylint-link are user-space tools that don't need
      # nightly. Install stable, install the dylint tools (taiki-e/install-action
      # falls back to `cargo install` when no prebuilt is published, picking up
      # whatever rustc is the active default), then install nightly.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      # cargo-dylint pinned via input; see input description for rationale.
      - name: Install dylint
        uses: taiki-e/install-action@cca35edeb1d01366c2843b68fc3ca441446d73d3 # v2
        with:
          tool: cargo-dylint@${{ inputs.cargo-dylint-version }},dylint-link@${{ inputs.cargo-dylint-version }}

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ inputs.solana-lints-toolchain }}
          components: rustc-dev, llvm-tools-preview

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ${{ inputs.anchor-workspace || inputs.rust-workspace }}

      - name: Clone solana-lints
        env:
          REF: ${{ inputs.solana-lints-ref }}
        run: |
          set -euo pipefail
          git clone https://github.com/crytic/solana-lints.git /tmp/solana-lints
          git -C /tmp/solana-lints checkout "$REF"

      - name: Cache built lint libraries
        id: lints-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/solana-lints/target/release
          key: solana-lints-${{ runner.os }}-${{ inputs.solana-lints-toolchain }}-${{ inputs.solana-lints-ref }}

      - name: Build lints
        if: steps.lints-cache.outputs.cache-hit != 'true'
        working-directory: /tmp/solana-lints
        # solana-lints is not a single Cargo workspace (root [workspace] only
        # contains `crate`, not `lints/*`), so each lint must be built
        # independently. Set CARGO_TARGET_DIR so all lints share one target
        # dir — otherwise each lint builds into lints/<name>/target/release/
        # and the cache path + DYLINT_LIBRARY_PATH below don't match reality.
        env:
          CARGO_TARGET_DIR: /tmp/solana-lints/target
        run: |
          set -euo pipefail
          for lint in lints/*/; do
            (cd "$lint" && cargo build --release)
          done

      - name: Run dylint
        env:
          DYLINT_LIBRARY_PATH: /tmp/solana-lints/target/release
        run: cargo dylint --all -- --all-targets

  verifiable-build:
    needs: detect
    # Runs automatically on push to the default branch, and on-demand via
    # workflow_dispatch on any branch (useful for ad-hoc release builds and
    # for testing this workflow on feature branches).
    if: >-
      needs.detect.outputs.has-anchor == 'true' && (
        (github.event_name == 'push' &&
         github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.anchor-workspace || inputs.rust-workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache solana-verify binary
        id: cache-solana-verify
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ runner.os }}-${{ inputs.solana-verify-version }}

      - name: Install solana-verify
        if: steps.cache-solana-verify.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: cargo install --locked solana-verify --version ${{ inputs.solana-verify-version }}

      - name: Verifiable build
        run: solana-verify build

      - name: Compute executable hashes
        run: |
          set -euo pipefail
          shopt -s nullglob
          binaries=(target/deploy/*.so)
          if [[ ${#binaries[@]} -eq 0 ]]; then
            echo "::error::solana-verify build produced no .so files in target/deploy"
            exit 1
          fi
          {
            echo "## Verifiable build"
            echo ""
            echo "solana-verify \`${{ inputs.solana-verify-version }}\`"
            echo ""
            echo "| Program | sha256 |"
            echo "| --- | --- |"
            for so in "${binaries[@]}"; do
              name=$(basename "$so" .so)
              hash=$(solana-verify get-executable-hash "$so")
              echo "| \`$name\` | \`$hash\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload program binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verifiable-build-${{ github.sha }}
          path: ${{ inputs.anchor-workspace || inputs.rust-workspace }}/target/deploy/*.so
          if-no-files-found: error
          retention-days: 90
