name: Static Analysis (reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      run-rust:
        description: "Run clippy + cargo-deny: 'auto' | 'true' | 'false'"
        required: false
        default: "auto"
        type: string
      run-solana:
        description: "Run Sec3 X-Ray + solana-lints: 'auto' | 'true' | 'false'"
        required: false
        default: "auto"
        type: string
      rust-workspace:
        description: "Path to Rust workspace root (must contain Cargo.toml)"
        required: false
        default: "."
        type: string
      anchor-workspace:
        description: "Path to Anchor workspace root (must contain Anchor.toml). Falls back to rust-workspace when empty."
        required: false
        default: ""
        type: string
      anchor-programs-path:
        description: "Path Sec3 X-Ray scans, resolved relative to anchor-workspace (the sec3-xray job's working directory). When empty, defaults to `programs` (i.e. <anchor-workspace>/programs)."
        required: false
        default: ""
        type: string
      rust-toolchain:
        description: "Toolchain for clippy when the workspace doesn't pin its own via rust-toolchain[.toml]. When a pin exists, that toolchain wins and clippy is installed on it."
        required: false
        default: "stable"
        type: string
      solana-lints-toolchain:
        description: "Nightly toolchain for the dylint lints (must match the lints repo's rust-toolchain). otter-sec/anchor-lints pins nightly-2025-09-18 (rustc 1.91); the legacy crytic/trailofbits solana-lints is stuck on nightly-2025-01-09 (rustc 1.86), too old for workspaces whose deps require rustc 1.88. Forced via RUSTUP_TOOLCHAIN at dylint time so a workspace rust-toolchain[.toml] pin can't override it."
        required: false
        default: "nightly-2025-09-18"
        type: string
      clippy-deny-warnings:
        description: "Treat clippy warnings as errors"
        required: false
        default: true
        type: boolean
      clippy-features:
        description: "Cargo feature selection for clippy: 'auto' | 'all' | 'default' | 'none' | a comma-separated feature list. 'auto' uses --all-features on plain Rust workspaces (maximum coverage) but *default* features on Anchor workspaces, whose feature sets are mutually exclusive by design — enabling `idl-build` together with `no-entrypoint` fails to compile (`error[E0425]: cannot find function __idl_dispatch`), and `no-entrypoint` also orphans imports that only the entrypoint uses. Set 'all' explicitly on an Anchor repo whose features really are additive."
        required: false
        default: "auto"
        type: string
      clippy-extra-args:
        description: "Extra whitespace-separated rustc/clippy lint arguments appended after `--` (e.g. `-A clippy::too_many_arguments`, or another `--check-cfg` expression for a cfg the shared allowlist below doesn't cover yet). Escape hatch so a single odd repo never has to wait on a change to this workflow."
        required: false
        default: ""
        type: string
      xray-version:
        description: "Sec3 X-Ray release tag to install"
        required: false
        default: "v0.0.6"
        type: string
      xray-sha256:
        description: "SHA256 of the Sec3 X-Ray linux-amd64 tarball. Optional but strongly recommended: when set, the downloaded archive is verified against this checksum before extraction, protecting against tampered release artifacts. Leave empty to skip verification."
        required: false
        default: ""
        type: string
      anchor-cli-version:
        description: "anchor-cli version installed for the sec3-xray job. X-Ray shells out to `anchor` for IDL extraction; missing it produces incomplete analysis."
        required: false
        default: "0.31.1"
        type: string
      solana-lints-repo:
        description: "Git URL of the dylint lints to build. Default is otter-sec/anchor-lints (actively maintained, Anchor-focused, edition 2024, a single Cargo workspace). The legacy trailofbits/crytic solana-lints is dormant and stuck on nightly-2025-01-09."
        required: false
        default: "https://github.com/otter-sec/anchor-lints.git"
        type: string
      solana-lints-ref:
        description: "Git ref (commit SHA or tag) of solana-lints-repo to build lints from. Must be compatible with solana-lints-toolchain."
        required: false
        default: "d8116dd619414c1b4dd9d17cd66458e66f699c0a"
        type: string
      cargo-dylint-version:
        description: "cargo-dylint / dylint-link version to install. Must match the dylint_linting version the lints repo builds against — otter-sec/anchor-lints uses dylint 5.x; cargo-dylint 5.0.0 builds cleanly on the nightly-2025-09-18 (rustc 1.91) the lints pin."
        required: false
        default: "5.0.0"
        type: string
      xray-fail-on-findings:
        description: >-
          Fail the sec3-xray job when X-Ray reports potential vulnerabilities.
          Its own exit code is always 0 and its findings never matched the fatal-error
          patterns, so before this the check could not fail on a finding. Set false to
          annotate without failing while a repo works through a backlog.
        required: false
        default: true
        type: boolean
      deny-config:
        description: "URL of the cargo-deny config to use. Pin to a tag/SHA for stable behavior across reusable-workflow versions."
        required: false
        default: "https://raw.githubusercontent.com/marinade-finance/.github/claude/static-analysis-required-wrapper/deny.toml"
        type: string

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      has-rust: ${{ steps.check.outputs.has-rust }}
      has-anchor: ${{ steps.check.outputs.has-anchor }}
      anchor-present: ${{ steps.check.outputs.anchor-present }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - id: check
        shell: bash
        env:
          RUN_RUST: ${{ inputs.run-rust }}
          RUN_SOLANA: ${{ inputs.run-solana }}
          RUST_WORKSPACE: ${{ inputs.rust-workspace }}
          ANCHOR_WORKSPACE_INPUT: ${{ inputs.anchor-workspace }}
          ANCHOR_WORKSPACE: ${{ inputs.anchor-workspace || inputs.rust-workspace }}
        run: |
          set -euo pipefail

          if [[ ! -d "$RUST_WORKSPACE" ]]; then
            echo "::error::rust-workspace '$RUST_WORKSPACE' does not exist"
            exit 1
          fi

          if [[ "$RUN_SOLANA" != "false" ]] && \
             [[ -n "$ANCHOR_WORKSPACE_INPUT" || "$RUN_SOLANA" == "true" ]]; then
            if [[ ! -d "$ANCHOR_WORKSPACE" ]]; then
              echo "::error::anchor-workspace '$ANCHOR_WORKSPACE' does not exist"
              exit 1
            fi
            if [[ ! -f "$ANCHOR_WORKSPACE/Anchor.toml" ]]; then
              echo "::error::Anchor.toml not found at '$ANCHOR_WORKSPACE/Anchor.toml'"
              exit 1
            fi
          fi

          if [[ "$RUN_RUST" == "true" ]]; then
            if [[ ! -f "$RUST_WORKSPACE/Cargo.toml" ]]; then
              echo "::error::run-rust='true' but Cargo.toml not found at '$RUST_WORKSPACE/Cargo.toml'"
              exit 1
            fi
            HAS_RUST=true
          elif [[ "$RUN_RUST" == "false" ]]; then
            HAS_RUST=false
          elif [[ -f "$RUST_WORKSPACE/Cargo.toml" ]]; then
            HAS_RUST=true
          else
            HAS_RUST=false
          fi

          if [[ -d "$ANCHOR_WORKSPACE" && -f "$ANCHOR_WORKSPACE/Anchor.toml" ]]; then
            ANCHOR_PRESENT=true
          else
            ANCHOR_PRESENT=false
          fi

          if [[ "$RUN_SOLANA" == "true" ]]; then
            HAS_ANCHOR=true
          elif [[ "$RUN_SOLANA" == "false" ]]; then
            HAS_ANCHOR=false
          else
            HAS_ANCHOR=$ANCHOR_PRESENT
          fi

          echo "has-rust=$HAS_RUST" >> "$GITHUB_OUTPUT"
          echo "has-anchor=$HAS_ANCHOR" >> "$GITHUB_OUTPUT"
          echo "anchor-present=$ANCHOR_PRESENT" >> "$GITHUB_OUTPUT"

          {
            echo "## Detection results"
            echo "- Rust workspace: \`$RUST_WORKSPACE\` → has-rust=\`$HAS_RUST\`"
            echo "- Anchor workspace: \`$ANCHOR_WORKSPACE\` → has-anchor=\`$HAS_ANCHOR\` (Anchor.toml present: \`$ANCHOR_PRESENT\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  clippy:
    needs: detect
    if: needs.detect.outputs.has-rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.rust-workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy

      - name: Install clippy on workspace-pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f rust-toolchain.toml && ! -f rust-toolchain ]]; then
            echo "No workspace-pinned toolchain; relying on the one dtolnay installed."
            exit 0
          fi
          # `head -n1`: rustup 1.28.0 appends an "active because:" line that awk would fold into the name.
          ACTIVE=$(rustup show active-toolchain | head -n1 | awk '{print $1}')
          if [[ -z "$ACTIVE" ]]; then
            echo "::error::rust-toolchain[.toml] present but rustup couldn't resolve the pinned toolchain"
            exit 1
          fi
          echo "Workspace pins '$ACTIVE'; installing it with clippy."
          rustup toolchain install "$ACTIVE" --component clippy --no-self-update
          rustup show

      - name: Install libclang for clang-sys (if used)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Cargo.lock ]] && grep -q '^name = "clang-sys"' Cargo.lock; then
            echo "clang-sys detected in Cargo.lock — installing libclang-dev"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libclang-dev
          fi

      - name: Install protoc for prost/tonic build scripts (if used)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Cargo.lock ]] && grep -qE '^name = "(prost-build|tonic-build)"' Cargo.lock; then
            echo "prost-build/tonic-build detected in Cargo.lock — installing protobuf-compiler"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          fi

      # A build script that compiles .proto files needs them present; checkout
      # does not fetch submodules, so tx-svc's jito_protos/protos is empty and
      # its build.rs fails before clippy sees any Rust.
      - name: Check out submodules (if any)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .gitmodules ]]; then
            git submodule update --init --recursive --depth 1
          fi

      - name: Install libudev for hidapi (if used)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Cargo.lock ]] && grep -q '^name = "hidapi"' Cargo.lock; then
            echo "hidapi detected in Cargo.lock — installing libudev-dev"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
          fi

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ inputs.rust-workspace }}

      # KEEP IN SYNC with the identically-named step in the solana-lints job: same `run:` body, only `env:` differs.
      - name: Patch nightly-incompatible deps in Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          [[ -f Cargo.lock ]] || { echo "No Cargo.lock; skipping."; exit 0; }
          bump() {
            echo "$1 $2 cannot build on a modern rustc; updating to $3"
            # --precise exits non-zero when another package `=`-pins the crate (solana-frozen-abi requires ahash "=0.8.5"); never fail the gate on it.
            cargo update --package "$1@$2" --precise "$3" || \
              echo "::warning::could not bump $1 $2 to $3 (likely pinned by an exact '=' requirement); continuing with the locked version"
          }
          while read -r name version; do
            case "$name" in
              ahash)
                case "$version" in
                  0.7.[0-7]) bump "$name" "$version" 0.7.8 ;;
                  0.8.[0-6]) bump "$name" "$version" 0.8.7 ;;
                esac ;;
              wasm-bindgen)
                case "$version" in
                  0.2.*)
                    if (( ${version##*.} < 88 )); then
                      bump "$name" "$version" 0.2.88
                    fi ;;
                esac ;;
            esac
          done < <(awk '/^name = "(ahash|wasm-bindgen)"$/ {
                          name = $3; gsub(/"/, "", name)
                          getline; gsub(/version = |"/, "")
                          print name, $0
                        }' Cargo.lock)

      - name: cargo clippy
        shell: bash
        env:
          DENY_WARNINGS: ${{ inputs.clippy-deny-warnings }}
          FEATURE_SELECTION: ${{ inputs.clippy-features }}
          EXTRA_ARGS: ${{ inputs.clippy-extra-args }}
          ANCHOR_PRESENT: ${{ needs.detect.outputs.anchor-present }}
        run: |
          set -euo pipefail

          SELECTION="$FEATURE_SELECTION"
          if [[ "$SELECTION" == "auto" ]]; then
            if [[ "$ANCHOR_PRESENT" == "true" ]]; then SELECTION="default"; else SELECTION="all"; fi
            echo "clippy-features=auto → '$SELECTION' (Anchor.toml present: ${ANCHOR_PRESENT:-false})"
          fi
          FEATURE_ARGS=()
          case "$SELECTION" in
            all)     FEATURE_ARGS=(--all-features) ;;
            default) FEATURE_ARGS=() ;;
            none)    FEATURE_ARGS=(--no-default-features) ;;
            *)       FEATURE_ARGS=(--features "$SELECTION") ;;
          esac

          LINT_ARGS=()

          # --check-cfg is nightly-only before rustc 1.80, and four repos still pin 1.69/1.75 toolchains.
          rustc_mm=$(rustc -V | sed -E 's/^rustc ([0-9]+)\.([0-9]+).*/\1 \2/')
          read -r rustc_major rustc_minor <<< "$rustc_mm"
          if (( rustc_major > 1 || (rustc_major == 1 && rustc_minor >= 80) )); then
            LINT_ARGS+=(
              --check-cfg 'cfg(feature, values("anchor-debug","custom-heap","custom-panic","no-entrypoint","no-idl","no-log-ix-name","idl-build","cpi"))'
              --check-cfg 'cfg(target_os, values("solana"))'
            )
          else
            echo "::notice::rustc ${rustc_major}.${rustc_minor} predates --check-cfg (1.80); skipping cfg declarations, unexpected_cfgs does not exist on this toolchain"
          fi
          if [[ "$DENY_WARNINGS" == "true" ]]; then
            LINT_ARGS+=(-D warnings)
          fi
          if [[ -n "$EXTRA_ARGS" ]]; then
            # mapfile, not `read -a`: `read` stops at the first newline and would drop every later argument.
            mapfile -t extra < <(printf '%s' "$EXTRA_ARGS" | xargs -n1 printf '%s\n')
            LINT_ARGS+=("${extra[@]}")
          fi

          set -x
          cargo clippy --all-targets "${FEATURE_ARGS[@]}" -- "${LINT_ARGS[@]}"

  cargo-deny:
    needs: detect
    if: needs.detect.outputs.has-rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      # The config must land inside the workspace: the action's container cannot see a host path and silently falls back to its own defaults.
      - name: Resolve cargo-deny config
        env:
          DENY_CONFIG_URL: ${{ inputs.deny-config }}
          REPO_DENY_CONFIG: ${{ inputs.rust-workspace }}/deny.toml
          DENY_CONFIG_PATH: ${{ inputs.rust-workspace }}/.ci-deny.toml
        run: |
          set -euo pipefail
          if [[ -f "$REPO_DENY_CONFIG" ]]; then
            echo "Using repo-local deny.toml: $REPO_DENY_CONFIG"
            cp "$REPO_DENY_CONFIG" "$DENY_CONFIG_PATH"
          else
            echo "Fetching org cargo-deny config: $DENY_CONFIG_URL"
            curl -fsSL "$DENY_CONFIG_URL" -o "$DENY_CONFIG_PATH"
          fi

      - uses: EmbarkStudios/cargo-deny-action@5bb39ff5d5a0e94dc9e2dc94eced0c6129743a57 # v2
        with:
          command: check
          manifest-path: ${{ inputs.rust-workspace }}/Cargo.toml
          command-arguments: --config ${{ inputs.rust-workspace }}/.ci-deny.toml all

  sec3-xray:
    needs: detect
    if: needs.detect.outputs.has-anchor == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.anchor-workspace || inputs.rust-workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache anchor-cli binary
        id: cache-anchor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ runner.os }}-${{ inputs.anchor-cli-version }}

      - name: Install anchor-cli
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          ANCHOR_CLI_VERSION: ${{ inputs.anchor-cli-version }}
        run: cargo install --locked anchor-cli --version "$ANCHOR_CLI_VERSION"

      - name: Install Sec3 X-Ray
        working-directory: ${{ github.workspace }}
        env:
          XRAY_VERSION: ${{ inputs.xray-version }}
          XRAY_SHA256: ${{ inputs.xray-sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.xray"
          TARBALL="${RUNNER_TEMP:-/tmp}/xray.tar.gz"
          curl -fsSL \
            "https://github.com/sec3-product/x-ray/releases/download/${XRAY_VERSION}/x-ray-${XRAY_VERSION}-linux-amd64.tar.gz" \
            -o "$TARBALL"
          if [[ -n "$XRAY_SHA256" ]]; then
            echo "$XRAY_SHA256  $TARBALL" | sha256sum -c -
          else
            echo "::warning::xray-sha256 not set — skipping integrity check of X-Ray tarball. Pin a SHA256 via the xray-sha256 input to guard against tampered release artifacts."
            sha256sum "$TARBALL"
          fi
          tar -xz -C "$HOME/.xray" -f "$TARBALL"
          rm -f "$TARBALL"
          echo "$HOME/.xray/bin" >> "$GITHUB_PATH"

      - name: Verify tool installations
        working-directory: ${{ github.workspace }}
        # Braces and `|| true` keep SIGPIPE from `head` out of `pipefail`.
        run: |
          set -euo pipefail
          if ! xray --version 2>&1; then
            { xray --help 2>&1 | head -20; } || true
          fi
          anchor --version

      - name: Run X-Ray
        env:
          ANCHOR_PROGRAMS_PATH: ${{ inputs.anchor-programs-path || 'programs' }}
          XRAY_FAIL_ON_FINDINGS: ${{ inputs.xray-fail-on-findings }}
        # X-Ray exits 0 on failure. Match only its own fatal lines: its IR-lowering pass emits `: error: ` diagnostics on valid Anchor code.
        run: |
          set -euo pipefail
          if [[ ! -d "$ANCHOR_PROGRAMS_PATH" ]]; then
            echo "::error::anchor-programs-path '$ANCHOR_PROGRAMS_PATH' does not exist"
            exit 1
          fi

          LOG="${RUNNER_TEMP:-/tmp}/xray.log"
          set -o pipefail
          xray "$ANCHOR_PROGRAMS_PATH" 2>&1 | tee "$LOG"

          if grep -nE '(^sh: [0-9]+:|^Error:|^ERROR:)' "$LOG" > /dev/null; then
            echo "::error::X-Ray reported errors during analysis (see annotations below)"
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -nE '(^sh: [0-9]+:|^Error:|^ERROR:)' "$LOG")
            exit 1
          fi

          # X-Ray's own vulnerability findings live in a summary block and never
          # touched the patterns above, so the job passed no matter what it found.
          SUMMARY=$(sed -n '/[Ss]ummary of potential vulnerabilities/,$p' "$LOG")
          {
            echo "## Sec3 X-Ray"
            echo ""
            if [[ -n "$SUMMARY" ]]; then
              echo '```'
              echo "$SUMMARY"
              echo '```'
            else
              echo "No findings summary in the output."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "$SUMMARY" ]]; then
            echo "::warning::X-Ray printed no findings summary — its output format may have changed, so findings cannot be detected. Check the log and the xray-version input."
            exit 0
          fi

          FINDINGS=$(printf '%s\n' "$SUMMARY" \
            | grep -nEi '(critical|high|medium|low)[[:space:]]*(severity|:)|severity[[:space:]]*[:=]|^[[:space:]]*[0-9]+\.[[:space:]]*[A-Za-z]' \
            || true)

          if [[ -n "$FINDINGS" ]]; then
            while IFS= read -r line; do
              echo "::error::X-Ray: $line"
            done <<< "$FINDINGS"
            if [[ "$XRAY_FAIL_ON_FINDINGS" == "true" ]]; then
              echo "::error::X-Ray reported potential vulnerabilities. Set xray-fail-on-findings: false to report without failing."
              exit 1
            fi
            echo "::warning::X-Ray reported potential vulnerabilities; not failing because xray-fail-on-findings is false."
          fi

  solana-lints:
    needs: detect
    if: needs.detect.outputs.has-anchor == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.anchor-workspace || inputs.rust-workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      # Stable before nightly: dtolnay makes the last-installed toolchain the rustup default, and dylint needs the nightly to win.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Install dylint
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-dylint@${{ inputs.cargo-dylint-version }},dylint-link@${{ inputs.cargo-dylint-version }}

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ inputs.solana-lints-toolchain }}
          components: rustc-dev, llvm-tools-preview

      - name: Install libclang for clang-sys (if used)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Cargo.lock ]] && grep -q '^name = "clang-sys"' Cargo.lock; then
            echo "clang-sys detected in Cargo.lock — installing libclang-dev"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libclang-dev
          fi

      - name: Install protoc for prost/tonic build scripts (if used)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Cargo.lock ]] && grep -qE '^name = "(prost-build|tonic-build)"' Cargo.lock; then
            echo "prost-build/tonic-build detected in Cargo.lock — installing protobuf-compiler"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          fi

      # A build script that compiles .proto files needs them present; checkout
      # does not fetch submodules, so tx-svc's jito_protos/protos is empty and
      # its build.rs fails before clippy sees any Rust.
      - name: Check out submodules (if any)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .gitmodules ]]; then
            git submodule update --init --recursive --depth 1
          fi

      - name: Install libudev for hidapi (if used)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Cargo.lock ]] && grep -q '^name = "hidapi"' Cargo.lock; then
            echo "hidapi detected in Cargo.lock — installing libudev-dev"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
          fi

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ inputs.anchor-workspace || inputs.rust-workspace }}

      # KEEP IN SYNC with the identically-named step in the clippy job: same `run:` body, only `env:` differs.
      - name: Patch nightly-incompatible deps in Cargo.lock
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ inputs.solana-lints-toolchain }}
        run: |
          set -euo pipefail
          [[ -f Cargo.lock ]] || { echo "No Cargo.lock; skipping."; exit 0; }
          bump() {
            echo "$1 $2 cannot build on a modern rustc; updating to $3"
            # --precise exits non-zero when another package `=`-pins the crate (solana-frozen-abi requires ahash "=0.8.5"); never fail the gate on it.
            cargo update --package "$1@$2" --precise "$3" || \
              echo "::warning::could not bump $1 $2 to $3 (likely pinned by an exact '=' requirement); continuing with the locked version"
          }
          while read -r name version; do
            case "$name" in
              ahash)
                case "$version" in
                  0.7.[0-7]) bump "$name" "$version" 0.7.8 ;;
                  0.8.[0-6]) bump "$name" "$version" 0.8.7 ;;
                esac ;;
              wasm-bindgen)
                case "$version" in
                  0.2.*)
                    if (( ${version##*.} < 88 )); then
                      bump "$name" "$version" 0.2.88
                    fi ;;
                esac ;;
            esac
          done < <(awk '/^name = "(ahash|wasm-bindgen)"$/ {
                          name = $3; gsub(/"/, "", name)
                          getline; gsub(/version = |"/, "")
                          print name, $0
                        }' Cargo.lock)

      - name: Clone dylint lints
        id: lints-checkout
        env:
          REPO: ${{ inputs.solana-lints-repo }}
          REF: ${{ inputs.solana-lints-ref }}
        run: |
          set -euo pipefail
          git clone "$REPO" /tmp/dylint-lints
          git -C /tmp/dylint-lints checkout "$REF"
          echo "sha=$(git -C /tmp/dylint-lints rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore built lint libraries
        id: lints-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/dylint-lints/target/release
          key: dylint-lints-v2-${{ runner.os }}-${{ inputs.solana-lints-toolchain }}-${{ steps.lints-checkout.outputs.sha }}

      # --workspace, not a bare build: the lints repo's root is itself a package, so the default build target is that root crate and none of the lints/* cdylibs.
      - name: Build lints
        if: steps.lints-cache.outputs.cache-hit != 'true'
        working-directory: /tmp/dylint-lints
        run: cargo build --release --workspace

      # Without this, an empty or stale lint cache makes `cargo dylint --all` load zero lints and exit 0 — a green gate that checked nothing.
      - name: Verify lint libraries were built
        shell: bash
        env:
          DYLINT_LIBRARY_PATH: /tmp/dylint-lints/target/release
        run: |
          set -euo pipefail
          shopt -s nullglob
          # dylint only loads files named lib<name>@<toolchain>.so; a bare lib<name>.so is invisible to it.
          libs=("$DYLINT_LIBRARY_PATH"/lib*@*.so)
          shopt -u nullglob
          if [[ ${#libs[@]} -eq 0 ]]; then
            echo "::error::No dylint libraries in $DYLINT_LIBRARY_PATH — cargo dylint would load zero lints and pass. Bust the dylint-lints cache or check solana-lints-ref."
            exit 1
          fi
          printf 'loaded %d lint library(ies):\n' "${#libs[@]}"
          printf '  %s\n' "${libs[@]##*/}"

      # Saving after the check, not via actions/cache, is what keeps a failed build from caching an empty target dir that later runs restore into a zero-lint pass.
      - name: Save built lint libraries
        if: steps.lints-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/dylint-lints/target/release
          key: dylint-lints-v2-${{ runner.os }}-${{ inputs.solana-lints-toolchain }}-${{ steps.lints-checkout.outputs.sha }}

      - name: Run dylint
        env:
          DYLINT_LIBRARY_PATH: /tmp/dylint-lints/target/release
          RUSTUP_TOOLCHAIN: ${{ inputs.solana-lints-toolchain }}
        run: cargo dylint --all -- --all-targets
