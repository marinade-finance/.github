name: Static Analysis

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  static-analysis:
    # TEMPORARY, and MUST become `@main` before this merges. Pointed at this
    # PR's own branch so the org ruleset exercises the static-analysis.yml being
    # reviewed here. It previously pointed at `claude/static-analysis-required-wrapper`
    # (PR #6) while the deny-config comment claimed the two matched — they did
    # not, so this repo's own checks were validating a different branch than the
    # one under review. Leaving a workflow on main that calls a feature branch
    # breaks every consumer the moment that branch is deleted.
    uses: marinade-finance/.github/.github/workflows/static-analysis.yml@claude/github-reusable-workflows-mi4w82
    with:
      rust-workspace:       ${{ vars.STATIC_ANALYSIS_RUST_WORKSPACE       || '.' }}
      anchor-workspace:     ${{ vars.STATIC_ANALYSIS_ANCHOR_WORKSPACE     || '' }}
      anchor-programs-path: ${{ vars.STATIC_ANALYSIS_ANCHOR_PROGRAMS_PATH || '' }}
      run-rust:             ${{ vars.STATIC_ANALYSIS_RUN_RUST             || 'auto' }}
      run-solana:           ${{ vars.STATIC_ANALYSIS_RUN_SOLANA           || 'auto' }}
      anchor-cli-version:   ${{ vars.STATIC_ANALYSIS_ANCHOR_CLI_VERSION   || '0.31.1' }}
      clippy-deny-warnings: ${{ vars.STATIC_ANALYSIS_CLIPPY_DENY_WARNINGS != 'false' }}
      clippy-features:      ${{ vars.STATIC_ANALYSIS_CLIPPY_FEATURES      || 'auto' }}
      clippy-extra-args:    ${{ vars.STATIC_ANALYSIS_CLIPPY_EXTRA_ARGS    || '' }}
