name: Verify deployments (reusable)

# Manually-triggered reusable workflow. Builds programs verifiably with
# `solana-verify`, then for every program declared under `[programs.<cluster>]`
# in Anchor.toml, fetches the on-chain hash and compares.
#
# Consumers should wrap this in a workflow with `on: workflow_dispatch:`.

# Cap the GITHUB_TOKEN at workflow scope to the minimum the job needs.
# This workflow only reads code (verifiable build + RPC reads against
# on-chain program hashes) and never writes to the repo or to any
# protected resource. Setting permissions here overrides whatever the
# caller granted.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      rust-workspace:
        description: "Path to Rust workspace root. Used as fallback when anchor-workspace is empty."
        required: false
        default: "."
        type: string
      anchor-workspace:
        description: "Path to Anchor workspace root (must contain Anchor.toml). Falls back to rust-workspace when empty."
        required: false
        default: ""
        type: string
      solana-verify-version:
        description: "solana-verify CLI version to install"
        required: false
        default: "0.4.15"
        type: string
      mainnet-rpc-url:
        description: "RPC URL or moniker for mainnet (Anchor.toml [programs.mainnet])"
        required: false
        default: "mainnet-beta"
        type: string
      devnet-rpc-url:
        description: "RPC URL or moniker for devnet"
        required: false
        default: "devnet"
        type: string
      testnet-rpc-url:
        description: "RPC URL or moniker for testnet"
        required: false
        default: "testnet"
        type: string

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.anchor-workspace || inputs.rust-workspace }}
    steps:
      # `persist-credentials: false`: this job only reads code (verifiable
      # build, compares on-chain hashes), never pushes. Drop the
      # GITHUB_TOKEN that checkout would otherwise leave in `.git/config`
      # so a downstream step or third-party build script can't use it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Validate Anchor workspace
        env:
          ANCHOR_WORKSPACE: ${{ inputs.anchor-workspace || inputs.rust-workspace }}
        # Run from $GITHUB_WORKSPACE so this step doesn't itself fail with a
        # cd error if the configured directory is missing.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ ! -d "$ANCHOR_WORKSPACE" ]]; then
            echo "::error::anchor-workspace '$ANCHOR_WORKSPACE' does not exist"
            exit 1
          fi
          if [[ ! -f "$ANCHOR_WORKSPACE/Anchor.toml" ]]; then
            echo "::error::Anchor.toml not found at '$ANCHOR_WORKSPACE/Anchor.toml'"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache solana-verify binary
        id: cache-solana-verify
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ runner.os }}-${{ inputs.solana-verify-version }}

      - name: Install solana-verify
        if: steps.cache-solana-verify.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: cargo install --locked solana-verify --version ${{ inputs.solana-verify-version }}

      - name: Verifiable build
        run: solana-verify build

      - name: Compare against on-chain deployments
        env:
          MAINNET_URL: ${{ inputs.mainnet-rpc-url }}
          DEVNET_URL: ${{ inputs.devnet-rpc-url }}
          TESTNET_URL: ${{ inputs.testnet-rpc-url }}
        shell: bash
        run: |
          set -euo pipefail

          # Emit one row per (cluster, program_name, program_id) from Anchor.toml.
          # Redirect python3 output to a temp file (rather than using
          # `mapfile -t entries < <(python3 ...)`) so a non-zero exit from
          # tomllib — e.g., a malformed Anchor.toml — fails the step under
          # `set -e`. With process substitution, the subshell's exit status
          # isn't propagated and a parse error would silently degrade to
          # "no [programs.*] sections" and a clean exit.
          ENTRIES_FILE="${RUNNER_TEMP:-/tmp}/anchor-programs.tsv"
          python3 - > "$ENTRIES_FILE" <<'PY'
          import tomllib
          with open("Anchor.toml", "rb") as f:
              data = tomllib.load(f)
          for cluster, mapping in data.get("programs", {}).items():
              if not isinstance(mapping, dict):
                  continue
              for name, pubkey in mapping.items():
                  print(f"{cluster}\t{name}\t{pubkey}")
          PY
          mapfile -t entries < "$ENTRIES_FILE"

          if [[ ${#entries[@]} -eq 0 ]]; then
            echo "::warning::Anchor.toml has no [programs.*] sections to verify"
            echo "## Verify deployments" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Anchor.toml has no \`[programs.*]\` sections — nothing to verify." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          shopt -s nullglob
          local_binaries=(target/deploy/*.so)
          shopt -u nullglob
          if [[ ${#local_binaries[@]} -eq 0 ]]; then
            echo "::error::solana-verify build produced no .so files in target/deploy — nothing to compare against on-chain"
            exit 1
          fi

          declare -A LOCAL_HASH
          for so in "${local_binaries[@]}"; do
            name=$(basename "$so" .so)
            LOCAL_HASH[$name]=$(solana-verify get-executable-hash "$so")
          done

          cluster_url() {
            case "$1" in
              localnet)              echo "" ;;
              mainnet|mainnet-beta)  echo "$MAINNET_URL" ;;
              devnet)                echo "$DEVNET_URL" ;;
              testnet)               echo "$TESTNET_URL" ;;
              *)                     echo "$1" ;;  # treat unknown as a literal URL/moniker
            esac
          }

          short() { printf '%s' "${1:0:8}…${1: -6}"; }

          {
            echo "## Verify deployments"
            echo ""
            echo "solana-verify \`${{ inputs.solana-verify-version }}\` — built at \`$(git rev-parse --short HEAD)\`"
            echo ""
            echo "| Cluster | Program | Pubkey | Local | On-chain | Status |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          mismatches=0
          for entry in "${entries[@]}"; do
            IFS=$'\t' read -r cluster name pubkey <<< "$entry"
            local_hash="${LOCAL_HASH[$name]:-}"
            local_short="—"
            [[ -n "$local_hash" ]] && local_short="\`$(short "$local_hash")\`"

            url=$(cluster_url "$cluster")
            if [[ -z "$url" ]]; then
              status="⏭ skipped (localnet)"
              on_chain_short="—"
            elif [[ -z "$local_hash" ]]; then
              status="⚠ no local build"
              on_chain_short="—"
            else
              if on_chain_hash=$(solana-verify get-program-hash "$pubkey" --url "$url" 2>/dev/null); then
                on_chain_short="\`$(short "$on_chain_hash")\`"
                if [[ "$local_hash" == "$on_chain_hash" ]]; then
                  status="✅ match"
                else
                  status="❌ mismatch"
                  mismatches=$((mismatches + 1))
                fi
              else
                status="⏸ not deployed / RPC error"
                on_chain_short="—"
              fi
            fi

            echo "| \`$cluster\` | \`$name\` | \`$(short "$pubkey")\` | $local_short | $on_chain_short | $status |" \
              >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo ""
            if [[ $mismatches -gt 0 ]]; then
              echo "**$mismatches mismatch(es) detected** — the on-chain bytecode differs from a verifiable build of the current ref."
            else
              echo "All checked deployments match the verifiable build of the current ref."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
