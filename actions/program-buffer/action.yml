name: program-buffer tools
description: >-
  Puts program_buffer.py, the tooling of the program-buffer workflows, on the runner.
  Called with `uses: $/actions/program-buffer`, so the script is the one of the workflow's own commit.
outputs:
  script:
    description: Path of program_buffer.py
    value: ${{ steps.path.outputs.script }}
runs:
  using: composite
  steps:
    - id: path
      shell: bash
      run: |
        set -euo pipefail
        script="$GITHUB_ACTION_PATH/program_buffer.py"
        test -f "$script"
        echo "script=$script" >> "$GITHUB_OUTPUT"
