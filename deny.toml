[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# All ignored advisories are unfixable transitive dependencies pulled in
# through the Solana / Anchor / SPL ecosystem (solana-sdk, solana-zk-sdk,
# spl-token-2022, anchor-lang, …). Revisit when the upstream Solana crates
# upgrade past these.
ignore = [
  # ed25519-dalek <2.0 — public-key oracle attack. solana-sdk pins 1.x.
  "RUSTSEC-2022-0093",
  # curve25519-dalek timing variability in Scalar*::sub. Solana-internal.
  "RUSTSEC-2024-0344",
  # atty unmaintained. Pulled by solana-logger via env_logger 0.9.
  "RUSTSEC-2024-0375",
  # derivative unmaintained. Pulled via ark-ff / ark-ec.
  "RUSTSEC-2024-0388",
  # paste unmaintained. Pulled via solana-program / anchor-lang.
  "RUSTSEC-2024-0436",
  # number_prefix unmaintained. Pulled via indicatif.
  "RUSTSEC-2025-0119",
  # bincode 1.x unmaintained. Pulled via solana-sdk.
  "RUSTSEC-2025-0141",
  # libsecp256k1 unmaintained. Pulled via solana-sdk.
  "RUSTSEC-2025-0161",
  # rand unsoundness with custom logger. Pulled via solana-sdk / spl-pod.
  "RUSTSEC-2026-0097",
  # --- Newly surfaced (2026-06) via validator-bonds; all transitive. ---
  # Unmaintained crates (no action without upstream bumps):
  "RUSTSEC-2021-0139",  # ansi_term unmaintained
  "RUSTSEC-2025-0012",  # backoff unmaintained
  "RUSTSEC-2024-0384",  # instant unmaintained
  "RUSTSEC-2024-0370",  # proc-macro-error unmaintained
  "RUSTSEC-2026-0173",  # proc-macro-error2 unmaintained
  "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained
  "RUSTSEC-2024-0320",  # yaml-rust unmaintained (via serde_yaml 0.8)
  # rustls-webpki advisories — LOW severity / narrow scope:
  # 0098/0099 affect private PKIs using URI name constraints (public Web PKI / HTTPS unaffected);
  # 0104 only affects apps that parse CRL
  "RUSTSEC-2026-0049",  # rustls-webpki: CRL distribution-point matching
  "RUSTSEC-2026-0098",  # rustls-webpki: URI-name constraints incorrectly accepted
  "RUSTSEC-2026-0099",  # rustls-webpki: name constraints accepted for wildcard cert
  "RUSTSEC-2026-0104",  # rustls-webpki: reachable panic in CRL parsing
]

# Permissive-only allow list. Anything copyleft (GPL/LGPL/AGPL/EUPL/EPL),
# source-disclosure-required, or commercial-restricting must NOT be added
# without an explicit security review — the goal is that downstream consumers
# can ship binaries built from this tree without source-disclosure obligations.
[licenses]
allow = [
  # Classic permissive
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  # Boost — permissive, no patent grant. Used as alternative by `ryu`.
  "BSL-1.0",
  # Public-domain-equivalents. Used as alternatives by csv, aho-corasick,
  # memchr, termcolor, walkdir, adler2, constant_time_eq, …
  "0BSD",
  "Unlicense",
  "MIT-0",
  "CC0-1.0",
  # Weak copyleft, file-level — file-level disclosure only.
  "MPL-2.0",
  # zlib (libz-rs-sys / zlib-rs and tinyvec/bytemuck/cfg_eval as alternative).
  "Zlib",
  # ICU / idna stack pulled in via reqwest -> url -> idna.
  "Unicode-3.0",
  # webpki-roots ships the Mozilla CA bundle.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []
# Skip license checks for first-party unpublished workspace crates (publish = false).
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# First-party workspace crates reference each other by path (no version); allowed
# because they are publish = false (not published to crates.io).
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/marinade-finance/solana-snapshot-parser",
  "https://github.com/marinade-finance/solana-transaction-executor",
  "https://github.com/marinade-finance/solana-transaction-builder",
]
