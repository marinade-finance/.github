# Org-wide cargo-deny policy for marinade-finance.
#
# DESIGN RULE: this file contains only what cargo-deny's own defaults cannot
# express. Everything present is either (a) `licenses.allow`, which has no
# usable default, or (b) an override that names the repos it unblocks, the
# finding it covers, and the change that retires it. If a check fails, the fix
# belongs in the repo that owns the dependency — not here. Do not add an
# `ignore` entry to make a repo green.
#
# Verified against cargo-deny 0.20.2 by running it with an empty config. Its
# defaults, which this file deliberately does NOT restate:
#   [advisories] vulnerability/unsound = deny (not configurable),
#                unmaintained = "all", yanked = "warn", ignore = [],
#                db-path = $CARGO_HOME/advisory-dbs, db-urls = [rustsec]
#   [licenses]   allow = [], exceptions = [], clarify = [],
#                private.ignore = false, confidence-threshold = 0.8
#   [bans]       multiple-versions = "warn", wildcards = "allow",
#                allow-wildcard-paths = false, deny/skip/skip-tree = []
#   [sources]    unknown-registry = "warn", unknown-git = "warn",
#                allow-registry = ["https://github.com/rust-lang/crates.io-index"]
#
# Notable consequences of sitting at the defaults, all deliberate:
#   * `yanked` is a warning, not an error. 35 yanked crate versions across the
#     fleet are transitive Solana/SPL/Anchor pins; yanks motivated by a security
#     problem land in the advisory DB and still fail as vulnerabilities.
#   * First-party workspace crates with no `license` field fail as `unlicensed`.
#     That is the intended pressure: add `license = "Apache-2.0"` in the owning
#     repo. `publish = false` alone does not satisfy the default.
#   * Wildcard path dependencies are not checked. The `bans.wildcards = "deny"`
#     + `allow-wildcard-paths = true` pair that used to live here flagged 20
#     crates, 19 of which the default `unlicensed` check already flags — the
#     same one-line manifest fix clears both, so the pair bought no new signal
#     and its `allow-wildcard-paths` half could name no retirement condition.

[advisories]
# cargo-deny's default is `unmaintained = "all"`, which is untenable here rather
# than merely inconvenient, and this is the measurement: at "all" the fleet
# produces 276 unmaintained errors across 29 repos, 251 of which are transitive
# crates inside the Solana/Anchor/SPL/ark stack (bincode, libsecp256k1, atty,
# derivative, number_prefix, paste, im/bitmaps/sized-chunks, …). No change in a
# consuming repo can remove them, and several — im, bitmaps, sized-chunks — have
# `patched = []`: no fixed release will ever exist. Scoping to "workspace" drops
# that to 25 errors covering exactly 4 advisories, every one of them a crate a
# workspace member depends on *directly* and can therefore act on (see the
# backlog: bincode, structopt, dotenv, opentelemetry-jaeger). This single key
# replaces the 18 hand-maintained ignore entries it used to take to say the same
# thing, and unlike them it automatically surfaces the next unmaintained direct
# dependency someone adds. Retire it by moving to `unmaintained = "all"` once no
# repo resolves an unmaintained transitive crate — realistically not before the
# whole fleet is on agave 3.x.
unmaintained = "workspace"
ignore = [
  # rustls-webpki, three cert-validation bugs: URI/wildcard name-constraint
  # handling and a reachable CRL-parsing panic.
  #
  # These are the only ignores in this file, and they are here because no fixed
  # release exists to move to — not because moving is hard. The advisory DB
  # lists `patched = ["0.104.0-alpha.6"]` / `["0.104.0-alpha.7"]`: a
  # pre-release. Every stable rustls-webpki is affected, including the newest;
  # marinade-config already resolves 0.103.13 and still matches all three.
  #
  # Repos: 18 of 29 — delegation-strategy-2, marcrank, marinade-common-rs-cli,
  # marinade-config, native-staking, recipes-distribution,
  # solana-randomness-registry, solana-stake-status, solana-transaction-builder,
  # solana-transaction-executor, stake-liquidator, stakes-etl, tx-router,
  # tx-svc, unstake, unstake-split-service, validator-bonds, validator-manager.
  #
  # RETIRE: delete all three the day rustls-webpki 0.104.0 ships as a stable
  # release and repos pick it up. Nothing else needs to happen first. Until
  # then, deleting them makes those 18 repos permanently red with no available
  # remedy, which is why they survive the "no overrides" rule.
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",

  # curve25519-dalek 3.2.x and ed25519-dalek 1.0.1, reached through monolithic
  # solana-sdk <=2.x, which pins solana-keypair below the versions that carry the
  # fixes. 25 repos; no in-repo remedy exists.
  # RETIRE: per repo, on moving off solana-sdk <=2.x to the granular solana-*
  # crates. The four repos already free of both advisories have no solana-sdk
  # dependency at all, which is what makes that the fix rather than a Solana bump.
  "RUSTSEC-2024-0344",
  "RUSTSEC-2022-0093",
]

# Permissive-only allow list. Anything copyleft (GPL/LGPL/AGPL/EUPL/EPL),
# source-disclosure-required, or commercial-restricting must NOT be added
# without an explicit legal review — the goal is that downstream consumers can
# ship binaries built from this tree without source-disclosure obligations.
#
# This list is exactly the set proven load-bearing: removing any one entry
# rejects at least one crate that no other allowed license covers. It was
# derived by collecting every SPDX expression in the fleet (51 distinct) and
# solving for the minimum cover, then re-testing each entry individually.
# Five permissive licenses were dropped because every crate offering them also
# offers an allowed alternative, so allowing them decided nothing:
# `Apache-2.0 WITH LLVM-exception`, `BSL-1.0`, `MIT-0`, `Unlicense`, `OpenSSL`
# (the last is now scoped to `ring` alone, below). If a future crate is licensed
# *solely* under one of those, CI fails and the fix is a reviewed one-line
# addition here — that is the intended workflow, not a regression.
[licenses]
# Skip the unlicensed check for crates marked `publish = false`. Deliberate: it
# takes 67 first-party crates needing a license field down to 32, at the cost of
# never flagging a future internal crate.
private = { ignore = true }

allow = [
  # Classic permissive.
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",           # aws-lc-rs/-sys, libloading, forwarded-header-value
  # Public-domain-equivalents, required outright (not as OR-alternatives).
  "0BSD",          # enum-iterator, enum-iterator-derive
  "CC0-1.0",       # constant_time_eq 0.1.5, keccak, tiny-keccak
  # Weak copyleft, file-level disclosure only.
  "MPL-2.0",       # attohttpc; also satisfies `MPL-2.0+` (im, bitmaps, …)
  "Zlib",          # foldhash, zlib-rs, libz-rs-sys
  # Unicode data tables, reached via url -> idna -> icu_*.
  "Unicode-3.0",
  # unicode-ident <= 1.0.12 is "(MIT OR Apache-2.0) AND Unicode-DFS-2016".
  # Permissive, attribution-only. Newer releases use Unicode-3.0, so this only
  # matters for locks still pinning the old proc-macro2/syn stack.
  "Unicode-DFS-2016",
  # webpki-root-certs / webpki-roots ship the Mozilla CA bundle.
  "CDLA-Permissive-2.0",
  # libbz2-rs-sys, the default backend of bzip2 0.6 (agave-snapshots 4.x).
  # Permissive BSD-style, no source-disclosure obligation.
  "bzip2-1.0.6",
]
# Scoped rather than added to `allow` above: the OpenSSL license (pre-3.0 dual
# OpenSSL/SSLeay) is permissive with an advertising clause, but it is acceptable
# here only for the BoringSSL-derived assembly and C shims inside ring 0.16 —
# see the clarify stanza below. Repos: the 9 still on ring 0.16.20.
# RETIRE together with that clarify entry.
exceptions = [{ crate = "ring", allow = ["OpenSSL"] }]

# ring 0.16.20 declares only `license-file = "LICENSE"`, and cargo-deny cannot
# infer an expression from that file even at the default confidence threshold —
# it bundles three grants: Brian Smith's ISC-style code, MIT for the compiled-in
# third_party/fiat, and BoringSSL's inherited OpenSSL licensing. Scoped to
# `<0.17` on purpose: ring >= 0.17.9 declares a real SPDX expression itself, so
# the 4 repos still resolving ring 0.17.8 (solana-stake-status,
# solana-transaction-builder, solana-transaction-executor, tx-svc) fail as
# `unlicensed` and the fix is `cargo update -p ring` — a backlog item, not a
# clarification. Repos needing this entry: the 9 on ring 0.16.20, which is
# pinned by rustls 0.20 / webpki 0.22 in the Solana <= 1.18 client stack.
# RETIRE when no repo resolves ring below 0.17.9.
[[licenses.clarify]]
crate = "ring:<0.17"
expression = "MIT AND ISC AND OpenSSL"
license-files = []

# mpl-token-metadata 5.x ships without a `license` field despite Metaplex
# publishing it under Apache-2.0. Repos: solana-snapshot-parser, validator-bonds.
# RETIRE when Metaplex adds the field upstream and those repos re-pin.
[[licenses.clarify]]
crate = "mpl-token-metadata"
expression = "Apache-2.0"
license-files = []

# cargo-deny's default for both keys is "warn". Denying instead is the one place
# this file is deliberately stricter than the default: it is the only thing
# keeping an arbitrary git dependency out of the fleet, and it suppresses no
# finding — every exemption below is enumerated and dated. The default
# `allow-registry` value is correct and is therefore not restated.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  # jito-priority-fee-distribution / jito-tip-distribution are not published to
  # crates.io. Repo: delegation-strategy-2 (pinned rev).
  # RETIRE when Jito publishes those crates.
  "https://github.com/jito-foundation/jito-programs",
  # spl-governance 4.x is not published to crates.io. Repo: vote-aggregator.
  # RETIRE when spl-governance is published, or when vote-aggregator drops it.
  "https://github.com/solana-labs/solana-program-library",
  # marinade-sdk pins anchor 0.25 from git; the crates.io release of that
  # vintage lacks fixes it needs. Repo: marinade-sdk.
  # RETIRE when marinade-sdk moves to a published anchor release.
  "https://github.com/coral-xyz/anchor",
]

# First-party crates are routinely consumed as git dependencies pinned to a
# tag/branch (solana-transaction-builder, solana-snapshot-parser,
# marinade-client-rs, …) before they are ever published to crates.io. Trusting
# the org as a source is one entry instead of a per-URL list that grows with
# every new internal crate. Repos: liquid-staking-referral-program, marcrank,
# marinade-cli, marinade-common-rs-cli, solana-transaction-builder,
# stake-liquidator, validator-bonds, validator-manager.
# RETIRE when first-party crates are published to crates.io and consumed by
# version. Any git source outside this org remains denied.
[sources.allow-org]
github = ["marinade-finance"]
