# Copy to `.github/workflows/verifiable-build.yml`. Per-repo input values are in
# rollout/README.md — `library-name` is required for any multi-crate workspace.
name: Verifiable Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Concurrency belongs in the caller: a called workflow evaluates it in the
# caller's context, so a shared group name deadlocks it against this run.
concurrency:
  group: verifiable-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifiable-build:
    uses: marinade-finance/.github/.github/workflows/verifiable-build.yml@main
    with:
      library-name: 'my_program'
